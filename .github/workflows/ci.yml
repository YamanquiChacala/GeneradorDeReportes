name: Continuous Integration

on:
  push:
    branches: [ "main" ] # Runs when you push to main
  pull_request:
    branches: [ "main", "working" ] # Runs when you open a PR to main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Grabs your code from the repository
      - name: Checkout Code
        uses: actions/checkout@v6

      # 2. Sets up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      # 3. Installs your devDependencies from package.json
      - name: Install Dependencies
        run: npm ci # 'npm ci' is strictly for CI environments, it uses package-lock.json

      # 4. Runs your existing test and coverage script
      - name: Run Tests and Generate Coverage
        run: npm run test:coverage

      # 5. Uploads the lcov file to Codecov
      - name: Upload coverage reports to Codecov
        if: github.base_ref == 'main' || github.ref_name == 'main'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info

  version-check:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Fail if this version was already released
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION"; then
            echo "Version $VERSION is already released. Bump the version in this PR."
            exit 1
          fi

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy
      cancel-in-progress: false # queue deploys instead of cancelling

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      
      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      
      - name: Fail if this version was already released
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}"; then
            echo "Version ${{ steps.version.outputs.version }} is already released. Bump the version in your PR."
            exit 1
          fi

      - name: Install Dependencies
        run: npm ci
      
      - name: Build
        run: npm run build

      - name: Authenticate clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Push code to Apps Script
        run: npx clasp push --force

      - name: Update deployment
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEPLOYMENT_ID: ${{ vars.DEPLOYMENT_ID }}
        run: npx clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "v$VERSION"

      - name: Tag the release
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"